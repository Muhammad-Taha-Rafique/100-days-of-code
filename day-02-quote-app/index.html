<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-300 to-purple-400 flex items-center justify-center p-4">

  <div class="bg-white max-w-md w-full rounded-2xl shadow-xl border-t-4 border-blue-600 p-8 text-center">
    <p id="quote" class="text-lg md:text-xl italic leading-relaxed text-slate-700">
      Your quote will show here.
    </p>
    <p id="author" class="mt-4 text-xl font-semibold text-blue-600">
      Author
    </p>
    <button id="newQuoteBtn"
      class="mt-6 bg-blue-600 text-white text-lg px-6 py-3 rounded-lg transition hover:bg-blue-700 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
      New Quote
    </button>
  </div>

  <script src="index.js"></script>
</body>
</html>
