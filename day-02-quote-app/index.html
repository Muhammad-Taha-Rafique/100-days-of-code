<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">

  <div class="bg-white max-w-md w-full rounded-xl shadow-lg p-6 text-center">
    <p id="quote" class="text-xl italic text-slate-700">
      Your quote will show here.
    </p>
    <p id="author" class="mt-4 font-semibold text-slate-500">
      - Author
    </p>
    <button id="newQuoteBtn"
      class="mt-6 bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed">
      New Quote
    </button>
  </div>

    <script src="index.js"></script>
</body>
</html>
